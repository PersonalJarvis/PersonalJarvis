# Functional CI matrix (Wave 0, sub-task 0.3 - AD-4, discharges PC-1).
#
# Before this file the repo had NO functional CI: .github/workflows/ held only
# supply-chain workflows, none ran pytest/ruff/mypy. This is the cross-platform
# migration's load-bearing safety net - it is the only place the Windows-only
# maintainer sees a red check when macOS/Linux code breaks.
#
# Gating policy (deliberate, see docs/plans/cross-platform-mac-linux/WELLE-0):
#   * ruff / ruff format / mypy  -> REPORT-ONLY (continue-on-error). The repo
#     carries a large pre-existing lint/type backlog (636 ruff findings at
#     Wave 0); making them blocking would be red-from-day-one for reasons
#     unrelated to this migration. Clean them in a separate effort, then flip
#     continue-on-error off.
#   * import-cleanliness gate    -> BLOCKING. Proves `import jarvis` is clean on
#     Linux/macOS (no module-scope pywin32/winreg/global_hotkeys) - the €5-VPS
#     contract. A regression here breaks Mac/Linux outright.
#   * pytest + min-passed floor  -> BLOCKING. Any behavioral failure,
#     collection error, or mass-skip regression fails the relevant OS leg.
#
# Cost policy (added 2026-06-23): macOS runners bill at ~10x the Linux rate, so
# the macOS leg is OFF for ordinary push/PR runs and ON only for a manual
# workflow_dispatch (the `include_macos` input, default true). Linux + Windows
# run on every push/PR and catch almost all cross-platform regressions. A
# `concurrency` group cancels a superseded in-flight run so a burst of commits
# can't stack billable minutes. To prove macOS on demand: the Actions tab ->
# "Run workflow", or `gh workflow run ci.yml`. The `configure` job is the single
# source of truth for which OS legs run (consumed by both `test` and `jarvisctl`).
#
# Action SHAs are pinned to 40-char commits already vetted elsewhere in this
# repo's workflows (CVE-2025-30066 hardening).
#
# Consolidation (2026-08-20): three standalone workflows moved in here as jobs,
# because a contributor opening a PR should read ONE check list, not four. The
# behaviour each of them gated is unchanged, only its home is:
#
#   * frontend.yml            -> job `frontend` (npm test + build + bundle budget)
#   * realtime-reliability.yml-> jobs `realtime-contract` / `realtime-slim` /
#     `realtime-soak`. They keep their OWN fixed OS matrix (macOS on every run)
#     instead of `needs: configure`, exactly as before: the point of that suite
#     is a small focused macOS proof that does not multiply the full-suite cost.
#     The one dropped trigger is `push: tags`, because a tag points at a SHA
#     that main already proved on the push that created it.
#   * dragdrop-verify.yml     -> job `dragdrop`. GitHub has no per-job `paths:`
#     filter, so the path gate moved into `configure` as a git diff (stdlib +
#     git, no third-party action). Unresolvable base => the job RUNS.

name: CI

on:
  push:
    branches:
      - main
      - "wip/cross-platform-cloud-first-20260529"
  pull_request:
  workflow_dispatch:
    inputs:
      include_macos:
        description: "Also run the macOS leg (~10x runner cost). On by default for a manual run, since proving macOS is usually the point of dispatching by hand."
        type: boolean
        default: true
      run_contract_soak:
        description: "Run the extended synthetic realtime orchestration soak (not release evidence)."
        type: boolean
        default: true

# Cost control: a new push to the same ref cancels the previous in-flight run,
# so a burst of commits doesn't stack up billable runner minutes. Keyed on ref
# so different branches never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single source of truth for which OS legs run. macOS bills at ~10x the Linux
  # rate, so it is included ONLY for a manual workflow_dispatch with include_macos
  # (default true). Every ordinary push/PR runs the cheap Linux + Windows legs,
  # which catch almost all cross-platform regressions. Both `test` and `jarvisctl`
  # consume this output so the policy lives in exactly one place.
  configure:
    name: configure matrix (cost-aware)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      os-matrix: ${{ steps.pick.outputs.os-matrix }}
      dragdrop-matrix: ${{ steps.pick.outputs.dragdrop-matrix }}
      run-dragdrop: ${{ steps.paths.outputs.run-dragdrop }}
    steps:
      - name: Checkout (full history — the path gate needs a diff base)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pick OS matrix
        id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_macos }}" = "true" ]; then
            echo 'os-matrix=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
            echo 'dragdrop-matrix=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
            echo "macOS leg INCLUDED (manual dispatch)."
          else
            echo 'os-matrix=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo 'dragdrop-matrix=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo "macOS leg SKIPPED (cheap push/PR run). Dispatch manually to include it."
          fi

      # GitHub offers `paths:` only per WORKFLOW, never per job — so the path
      # gate that dragdrop-verify.yml got for free as its own file has to be
      # computed here. git + stdlib only: no third-party action enters the
      # supply chain for a file-list comparison (CVE-2025-30066).
      #
      # Fails OPEN on purpose: a manual dispatch, an unresolvable diff base, or
      # a first push to a new branch RUNS the job. A missed drag-drop
      # regression costs a broken overlay on someone else's OS; a redundant run
      # costs two cheap runner minutes.
      - name: Path gate for the drag-drop proof
        id: paths
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run-dragdrop=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — drag-drop proof RUNS."
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base="${{ github.event.before }}"
          fi
          # An all-zero "before" means a branch's first push or a rewritten
          # history; treat it as no base at all.
          case "$base" in
            ""|*[!0]*) : ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # checkout fetches the event's ref only, so origin/main may not exist
            # locally yet — same fetch the privacy-gate job below does.
            git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null || true
            base="$(git merge-base HEAD refs/remotes/origin/main 2>/dev/null || echo "")"
          fi
          if [ -z "$base" ]; then
            echo "run-dragdrop=true" >> "$GITHUB_OUTPUT"
            echo "No usable diff base — drag-drop proof RUNS (fail open)."
            exit 0
          fi
          if git diff --name-only "$base" HEAD -- \
              jarvis/overlay/drop_target.py \
              jarvis/overlay/drop_bridge.py \
              scripts/crossplatform/verify_drop_target.py \
              .github/workflows/ci.yml | grep -q .; then
            echo "run-dragdrop=true" >> "$GITHUB_OUTPUT"
            echo "Drop-path files changed since $base — drag-drop proof RUNS."
          else
            echo "run-dragdrop=false" >> "$GITHUB_OUTPUT"
            echo "No drop-path file changed since $base — drag-drop proof SKIPPED."
          fi

  test:
    name: test (${{ matrix.os }})
    needs: configure
    strategy:
      fail-fast: false # we want to see ALL OS legs, not just the first red one
      matrix:
        os: ${{ fromJSON(needs.configure.outputs.os-matrix) }}
    runs-on: ${{ matrix.os }}
    # 75, not 30 (2026-08-07): the suite outgrew the old budget without any
    # test hanging — at cancellation macOS sat at 95% and Windows at 40%,
    # both still advancing (Windows runners pace the suite at ~65 min). A
    # genuine wedge no longer hides in the budget either way: the main pytest
    # step below dumps every thread stack once a single test exceeds 300 s.
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install base + dev (NO platform extras - proves the VPS/base install)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff lint (report-only)
        continue-on-error: true
        run: python -m ruff check jarvis/

      - name: ruff format check (report-only)
        continue-on-error: true
        run: python -m ruff format --check jarvis/

      - name: mypy (report-only)
        continue-on-error: true
        run: python -m mypy jarvis/

      - name: Import-cleanliness gate (BLOCKING — runs on the bare .[dev] install)
        run: python scripts/ci/check_import_clean.py

      # The import gate above PROVES the €5-VPS base install imports clean (no
      # Windows APIs, no system libs). Only AFTER that proof do we install the
      # system libraries + optional packages the *test suite* needs to RUN — these
      # are NOT part of the base-install contract. libportaudio2 backs sounddevice
      # (a base dep that lazy-imports PortAudio); twilio is imported by some test
      # modules that lack an importorskip guard (pre-existing). Test-only Python
      # packages, including Hypothesis, come from the [dev] extra above so the
      # documented development install is exercised without hidden supplements.
      - name: System + test-only deps (to run the suite, not part of the base proof)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libportaudio2
          fi
          python -m pip install -e ".[telephony]"

      # The monolithic Windows process reached these stateful session tests at
      # 68%, then spent the rest of the 30-minute job budget in this two-file
      # block. Run it first in a fresh process with strict exit semantics and
      # named progress: a real regression stays blocking, while cross-suite
      # state cannot hide the remaining Windows coverage behind a timeout.
      # 2026-07-20: two consecutive main runs wedged INSIDE this step at the
      # same test (test_gemini_live_spending_cap_crosses_family_without_retrying)
      # for 23+ minutes until the 30-minute JOB timeout cancelled everything —
      # while the identical invocation passes in 16 s on a fast local Windows
      # box. Until the CI-only race is caught: faulthandler dumps every thread
      # stack once a single test exceeds 180 s (pytest built-in, no extra dep),
      # and the STEP timeout returns the job in 15 minutes with that dump in
      # the log instead of silently eating the whole job budget.
      - name: Windows realtime session isolation (BLOCKING)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 15
        shell: bash
        run: |
          python -m pytest \
            tests/unit/realtime/test_session.py \
            tests/unit/realtime/test_session_self_echo.py \
            -v -p no:cacheprovider \
            -o faulthandler_timeout=180 \
            -m "not skip_ci and not slow and not openclaw_live and not voice_latency and not eval" \
            --junitxml=realtime-session-report.xml

      - name: pytest (JUnit XML)
        shell: bash
        run: |
          # Exit code deliberately non-blocking: the suite still carries the
          # pre-existing env/platform backlog (Windows-only tests on the Linux
          # leg etc.), gated by the min-passed floor below. Re-tighten
          # (drop the `|| echo` and pass --strict) only once the backlog is
          # actually green cross-platform — flipping strict first turned the
          # v1.0.6 release head red on 133 long-tolerated failures.
          extra_pytest_args=()
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            extra_pytest_args+=(
              --ignore=tests/unit/realtime/test_session.py
              --ignore=tests/unit/realtime/test_session_self_echo.py
            )
          fi
          python -m pytest tests/ "${extra_pytest_args[@]}" -q -p no:cacheprovider \
            -o faulthandler_timeout=300 \
            -m "not skip_ci and not slow and not openclaw_live and not voice_latency and not eval" \
            --continue-on-collection-errors \
            --junitxml=report.xml \
            || echo "pytest exited non-zero (pre-existing failures are gated by the min-passed floor)"

      - name: Minimum-passed floor (BLOCKING, Linux leg is authoritative)
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/ci/assert_min_passed.py report.xml

      # Its OWN blocking step, on purpose, and two traps avoided deliberately:
      #
      #   * NOT carrying the `eval` marker. The suite above filters
      #     `-m "not ... and not eval"`, so an `eval`-marked routing test would
      #     silently never run — which is exactly how scripts/skill_routing_eval.py
      #     became invisible.
      #   * NOT folded into the pytest step above, which ends in `|| echo` and
      #     therefore swallows failures until the min-passed floor moves.
      #
      # Measures precision AND recall together. Watching only precision is how
      # the wake-word subsystem destroyed its own recall twice without anyone
      # noticing (AP-27); recall may not drop without editing the committed
      # BASELINE.json in the same change, which puts it in the diff.
      - name: Skill routing eval (BLOCKING — precision AND recall)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python -m pytest tests/unit/skills/test_skill_routing_offline.py \
            -q -p no:cacheprovider
          python scripts/skill_relevance_calibrate.py

      # The four guards CLAUDE.md §10 names by name, in their OWN blocking step
      # for the same reason the skill eval has one: the suite above ends in
      # `|| echo`, so a broken guard costs one passed test against a ~700-test
      # cushion above the min-passed floor and rides through green. These four
      # pin contracts that are cheap to break and expensive to notice later —
      # the router stays a pure dispatcher (ADR-0011), the voice scrubber stays
      # regex-only (AP-11), a status enum stays in step across all five layers
      # (AP-4, BUG-008 recurred 4x), and ONE resolver decides a turn's output
      # language (CLAUDE.md §1). Seconds to run; add a guard here when you add
      # one there.
      - name: Contract guards (BLOCKING — router, scrubber, enum parity, language)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python -m pytest \
            tests/unit/brain/test_routing.py \
            tests/unit/brain/test_output_filter.py \
            tests/unit/sessions/test_hangup_reason_parity.py \
            tests/unit/core/test_turn_language.py \
            -q -p no:cacheprovider

  # jarvisctl control-CLI unit suite across the three supported desktops.
  # jarvisctl is a thin cross-platform HTTP client (paths via platformdirs,
  # UTF-8 I/O, no Windows APIs); this job proves it imports + its unit tests
  # pass identically on Linux, macOS, and Windows. Own job (separate from the
  # main `test` matrix) so a CLI-only change gets a fast, isolated signal and
  # the suite can install just the CLI's runtime deps. fail-fast: false to see
  # all three OS legs.
  jarvisctl:
    name: jarvisctl unit (${{ matrix.os }})
    needs: configure
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.configure.outputs.os-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package (no deps) + CLI runtime deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" --no-deps
          # pytest is needed to RUN the suite; --no-deps above skips it (and all
          # of [dev]'s deps), so install the test runner explicitly alongside the
          # CLI's own runtime deps AND the light libs the cli_ctl test modules pull
          # in transitively (pyyaml/pydantic/loguru/dotenv/packaging, via
          # dispatch / self-control-catalog / discovery importing deeper jarvis
          # modules). Still light — no torch/audio/GUI/desktop deps.
          python -m pip install typer platformdirs click httpx rich pytest pytest-asyncio pyyaml pydantic loguru python-dotenv packaging

      - name: Import + --help smoke (CLI runs without desktop deps)
        # python:3.11-slim-equivalent: `--no-deps` above skipped torch / sounddevice
        # / etc., so this proves jarvis.cli_ctl imports and its --help renders on a
        # bare Linux/macOS/Windows with only typer/httpx/platformdirs/rich. No live
        # server here: the dynamic `api` build fails closed to the curated surface.
        run: |
          python -c "import jarvis.cli_ctl.__main__"
          python -m jarvis.cli_ctl --help

      - name: CLI coverage gate (every route mounted + tagged)
        # Static + stdlib-only: every jarvis/ui/web/*_routes.py router must be
        # mounted in server.py and carry tags=, so every WebUI action stays a
        # reachable, cleanly-grouped `jarvis api <tag>` command. Mirrors the
        # pre-push hook so a contributor without the hook can't bypass it.
        run: python scripts/ci/check_cli_coverage.py

      - name: Danger-metadata gate (destructive routes declare x-jarvis-dangerous)
        # Static + stdlib-only: a mutating route whose path matches a
        # destructive marker must carry openapi_extra x-jarvis-dangerous so the
        # CLI dynamic layer + Command Registry gate it. Mirrors pre-push.
        run: python scripts/ci/check_danger_metadata.py

      - name: Dead config switch gate (every switch is read by some code)
        # Static + stdlib-only: a config field nothing reads makes jarvis.toml
        # and the settings screen promise behaviour that does not exist (AP-31).
        # Known backlog is baselined; only a NEW one fails. Mirrors pre-push.
        run: python scripts/ci/check_config_switches_wired.py

      - name: Silent exception gate (no new invisible failure)
        # Static + stdlib-only: an except that neither logs, re-raises, nor
        # explains itself makes a failure invisible (AP-30). Per-file ratchet —
        # fails only when a file GAINS one. Mirrors pre-push.
        run: python scripts/ci/check_silent_exception_handlers.py

      - name: WebGL-context gate (every 3D surface gives its context back)
        # Static + stdlib-only: a browser allows ~16 live WebGL contexts and
        # kills the OLDEST to make room, and three.js `dispose()` never returns
        # one — so a scene that mounts without releasing eventually kills a
        # different, innocent scene on the page (AP-32).
        run: python scripts/ci/check_webgl_contexts_released.py

      - name: CLI reference drift gate (docs in sync with command tree)
        # Fails if a curated command was added/changed without regenerating
        # docs/jarvis-cli-reference.md. Mirrors the pre-push docgen gate.
        run: python scripts/ci/gen_cli_reference.py --check

      - name: Commands reference drift gate (docs in sync with the registry)
        # Fails if a Command-Registry entry was added/changed without
        # regenerating docs/commands-reference.md. Mirrors the pre-push gate.
        run: python scripts/ci/gen_commands_reference.py --check

      - name: Install base runtime deps for the test suite (robust; no hand-list)
        shell: bash
        # The cli_ctl unit tests import deeper jarvis modules that transitively
        # pull in base runtime deps (pydantic, pyyaml, loguru, …). Install the
        # package's BASE deps — torch-/GPU-free per the cloud-first base-install
        # mandate — instead of the hand-maintained dep list above, which silently
        # rots and REDS CI the moment a test imports one more transitive lib (the
        # recurring "ModuleNotFoundError: No module named 'yaml'/'pydantic'"
        # collection errors). The heavy desktop/voice extras stay OUT, so the
        # --help smoke above still proves the light install path.
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio hypothesis

      - name: pytest (jarvisctl unit suite)
        run: python -m pytest tests/unit/cli_ctl/ -v

  # Dependency-manifest sync gate (BLOCKING). requirements.in (the source for the
  # hash-pinned requirements.txt lockfile) must mirror pyproject.toml
  # [project].dependencies exactly. When they drift, an extras-only, torch-pulling
  # package (silero-vad, sentence-transformers, …) leaks into the base lockfile,
  # baking the multi-GB, GPU-specific CUDA wheel stack into the installer and
  # bricking `pip install --require-hashes -r requirements.txt` for every
  # non-maintainer machine (nvidia-cufile is unresolvable on plain PyPI). This is
  # the guard for that shipped-broken-installer "works on my machine" bug (AP-23).
  # Runs once: pinned uv resolves every advertised target from public PyPI.
  deps-sync:
    name: deps-sync + portable install matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pinned dependency-gate tooling
        run: python -m pip install --disable-pip-version-check packaging==25.0 uv==0.11.19

      - name: Requirements-sync gate (BLOCKING)
        run: |
          python scripts/ci/check_requirements_sync.py

      # Companion gate: the compiled requirements.txt itself must stay
      # `--universal` and free of nvidia-*/torch/CUDA wheels, so a lockfile
      # regenerated the wrong way cannot silently re-brick non-maintainer
      # installs (AP-23). Stdlib only — no extra install needed.
      - name: Lockfile universal + GPU-free gate (BLOCKING)
        run: python scripts/ci/check_lockfile_universal.py

      # A universal solve can still hide an inactive marker branch, an sdist,
      # or a wheel for a different interpreter/architecture. Compile one PEP
      # 751 lock per CPython/OS/architecture cell, inspect only active packages,
      # and dry-run the shipped hash lock plus the advertised [full] profile.
      # The gate also runs `uv lock --check` and byte-compares a no-upgrade
      # universal/hash recompile of requirements.in with requirements.txt.
      - name: Target-resolved portable install matrix (BLOCKING)
        run: python scripts/ci/check_portable_install_matrix.py --jobs 4

  # macOS still ships GNU bash 3.2 (2007) as /bin/bash, while every runner and
  # dev box here has bash 4/5. A script can therefore be valid everywhere we
  # look and still fail to PARSE on a Mac - meaning not one line of it runs.
  # That shipped: install/uninstall.sh in v1.1.0/v1.1.1 died with
  # `syntax error near unexpected token ';;'` on every Mac, because bash 3.2
  # cannot read a `case` arm inside a $( ) substitution. Nothing in CI parsed a
  # shell script against 3.2, so nothing caught it. This does, for pennies: a
  # parse check in a bash:3.2 container, never an execution. Own job (stdlib +
  # Docker only, no pip install), BLOCKING.
  shell-portability:
    name: shell portability (parses on macOS bash 3.2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: bash 3.2 parse gate (BLOCKING)
        run: python scripts/ci/check_shell_bash32.py --require

  # Tree-wide hygiene gates that used to live ONLY in the local pre-push hook.
  # When pre-push was cut back to the two credential gates (2026-08-05), these
  # three needed a home that reports instead of blocking an unrelated push:
  #
  #   * private keys   — a leaked signing key is permanent (AP-29). Also still
  #     runs in pre-push and pre-commit; the redundancy is deliberate.
  #   * dist consistency — dist/index.html and every chunk it loads must resolve
  #     to TRACKED files, or a fresh clone boots to a blank spinner while the
  #     builder's machine looks fine (AP-23).
  #   * brand logos    — a bundled SVG is executable content; a script or remote
  #     reference in one would run on render.
  #
  # Stdlib + git only, so no pip install. Runs on push AND PR. BLOCKING.
  repo-hygiene:
    name: repo-hygiene (keys / bundle / logos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Private-key gate (BLOCKING)
        run: python scripts/ci/check_no_private_keys.py

      - name: Dist consistency gate (BLOCKING)
        run: python scripts/ci/check_dist_consistency.py

      - name: Brand-logo gate (BLOCKING)
        run: python scripts/ci/check_brand_logos.py

      # CLAUDE.md §0 promises the agent-knowledge mirrors are held by "hook +
      # pre-commit + CI". The CI leg did not exist until 2026-08-20, so a commit
      # made with hooks uninstalled (`install_git_hooks.py` is a manual step)
      # could drift the trees with nothing to catch it. Three trees, two
      # engines: .claude <-> .agents is byte-identical, .codex is a generated
      # projection. Both are cheap — stdlib and git only.
      - name: Agent-knowledge mirrors (BLOCKING)
        run: |
          python scripts/ci/sync_agents_md.py --check
          python scripts/ci/sync_agents_dir.py --check
          python scripts/ci/sync_codex_agents.py --check

  # Output Language Policy enforcement (CLAUDE.md, HIGHEST PRIORITY): block any
  # NEWLY ADDED German text from reaching GitHub. Diff-based, so the in-flight
  # DE->EN translation backlog (pre-existing German) does NOT turn this red - only
  # German added by a push/PR does. Own job (runs once, not across the OS matrix);
  # stdlib + git only, so no pip install. BLOCKING.
  language-policy:
    name: language-policy (no new German)
    # PR-only: a push to main rewrites SHAs (rebase merge), which widens the
    # diff base and would re-flag pre-existing German. The protection belongs
    # on PRs, before the change reaches main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history - diff needs the merge base)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: No-new-German gate (BLOCKING)
        run: python scripts/ci/check_no_new_german.py

  # Privacy gate (Wave 2, layer 3): the non-bypassable backstop for the local
  # pre-push hook (.githooks/pre-push), which `--no-verify` can skip. Re-runs the
  # SAME secret / forbidden-file detection over the PR diff (reusing
  # scripts/ci/privacy_pre_push.py) and, when PRIVACY_PRIVATE_EMAILS is set as a
  # repo variable, the private-email identity check. Does NOT scan the real
  # name/PII (that is the ship skill's job to the public repo, and would
  # false-positive here). stdlib + git only, so no pip install. BLOCKING.
  #
  # Runs on push as well as PR (2026-08-05). It used to be PR-only, which meant
  # that on a repo whose maintainer pushes straight to main it ran nowhere at
  # all — and it is now one of only two layers left, since pre-push was cut back
  # to the credential gates. On push the diff base is the previous head; a first
  # push to a new branch has no previous head, so it falls back to the merge
  # base with origin/main.
  privacy-gate:
    name: privacy-gate (no secrets / no private identity)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history - diff needs the PR base)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Resolve diff base (PR base, previous push head, or merge base)
        id: base
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base="${{ github.event.before }}"
          fi
          # A branch's first push reports an all-zero "before"; so does a forced
          # history rewrite. Fall back to the merge base with main, which is the
          # widest base that still excludes what main already carries.
          case "$base" in
            ""|*[!0]*) : ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null || true
            base="$(git merge-base HEAD refs/remotes/origin/main 2>/dev/null || echo "")"
          fi
          if [ -z "$base" ]; then
            echo "No usable diff base — scanning against the empty tree."
            base="$(git hash-object -t tree /dev/null)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Diff base: $base"

      - name: Privacy gate (BLOCKING - secrets + forbidden files + identity)
        env:
          PRIVACY_PRIVATE_EMAILS: ${{ vars.PRIVACY_PRIVATE_EMAILS }}
        run: python scripts/ci/privacy_scan_ci.py --base "${{ steps.base.outputs.base }}"

  # Docs privacy gate (layer-3 backstop for the .githooks/pre-push docs scan,
  # which `--no-verify` can skip). Scans the tracked docs/ tree for the
  # maintainer's real name, private email/handle, personal Windows paths, and
  # machine/account ids, using the SAME manifest the public-release scrub
  # uses (scripts/ci/privacy_gate/references/pii-scrub.tsv) so the two
  # never drift. Unlike privacy-gate above, this DOES check the real name — but
  # ONLY inside docs/, where (maintainer decision 2026-06-29) it must never
  # appear, so it cannot false-positive on code where the name lives
  # legitimately. The privacy scan itself is stdlib-only; the public-reader
  # contract also parses YAML frontmatter and therefore installs the PyYAML
  # version pinned by the universal lock. BLOCKING.
  #
  # Runs on push as well as PR (2026-08-05): both steps scan the whole tracked
  # docs/ tree rather than a diff, so there is no base-widening reason to keep
  # them off pushes — and PR-only meant they never ran on a repo whose
  # maintainer pushes straight to main.
  docs-privacy:
    name: docs-privacy (no personal data in docs/)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install public-docs parser dependency
        run: python -m pip install --no-deps pyyaml==6.0.3

      - name: Docs privacy gate (BLOCKING - name / email / paths / ids in docs/)
        run: python scripts/ci/docs_privacy_scan.py

      - name: Public reader docs contract (BLOCKING)
        run: python scripts/ci/check_public_docs.py

  # Frontend test + production build (was frontend.yml until 2026-08-20).
  # Own job rather than a step in `test`: it needs Node, not Python, and a
  # frontend-only change should get its signal without waiting on the OS matrix.
  frontend:
    name: frontend (test + production build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jarvis/ui/web/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jarvis/ui/web/frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build and verify production assets
        run: npm run build

      # The entry chunk is parsed and executed before the UI paints a single
      # pixel, so its size IS startup latency. It guards the same regression
      # class as the Python boot budget — a statically imported view or library
      # quietly adding seconds to every launch — but it is the only HALF of that
      # pair a CI runner can measure. `check_boot_budget.py` boots the whole
      # application and needs an audio device to reach VOICE_USABLE, so it left
      # pre-push on 2026-08-05 and has no CI home; it is an on-demand local
      # command (`python scripts/ci/check_boot_budget.py`) that AP-26 asks you
      # to run by hand after touching the startup path. Do not read this step as
      # covering the Python side.
      - name: Check startup bundle budget
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/check_frontend_bundle_budget.py

  # Realtime's small, blocking cross-platform contract (was
  # realtime-reliability.yml until 2026-08-20).
  #
  # Deliberately NOT `needs: configure`: this matrix is hard-coded to all three
  # OSes including macOS on EVERY run. That is the whole reason the suite is
  # small — it buys a macOS proof on every change without paying the hour-long
  # full-suite cost, which is why `test` above keeps macOS behind a dispatch.
  #
  # No job here owns a microphone, speaker, desktop session, or provider secret.
  # Physical microphone/acoustic-echo behavior, device hot-plug, and macOS TCC
  # prompts remain explicit human release sign-offs; a headless runner must never
  # turn their absence into a fake green result.
  realtime-contract:
    name: realtime provider contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install portable base and focused test runner
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio

      - name: Blocking provider-neutral realtime contract
        run: >-
          python -m pytest
          tests/contract/test_realtime_provider_contract.py
          tests/contract/test_realtime_reliability_gate.py
          -q -p no:cacheprovider

  realtime-slim:
    name: realtime on python:3.11-slim (no PortAudio)
    runs-on: ubuntu-latest
    container: python:3.11-slim
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install base without system audio libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio

      - name: Prove the container really has no usable PortAudio
        run: |
          python - <<'PY'
          try:
              import sounddevice  # noqa: F401
          except Exception as exc:
              print(f"NO_PORTAUDIO: {type(exc).__name__}: {exc}")
          else:
              raise SystemExit("python:3.11-slim unexpectedly loaded PortAudio")
          PY

      - name: Blocking headless realtime degradation contract
        run: >-
          python -m pytest
          tests/contract/test_realtime_provider_contract.py
          tests/contract/test_realtime_reliability_gate.py
          -q -p no:cacheprovider

  realtime-soak:
    name: realtime extended contract soak (not release evidence)
    # This synthetic orchestration proof must never green-light a tag. A real
    # release still needs same-SHA target measurements and manual acoustic
    # sign-off, neither of which a headless GitHub runner can produce.
    if: github.event_name == 'workflow_dispatch' && inputs.run_contract_soak
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install portable base
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run provider-neutral orchestration soak
        run: python scripts/realtime_reliability_gate.py --contract-soak

  # Cross-platform drag-drop verification (was dragdrop-verify.yml until
  # 2026-08-20) — proves the overlay drop mechanism (tkdnd load + parse +
  # register + drop chain) actually EXECUTES on Windows, macOS AND Linux, by
  # running the same `scripts/crossplatform/verify_drop_target.py` on each.
  #
  # Gated by `configure`'s git-diff path check, because a workflow-level
  # `paths:` filter cannot apply to a single job. macOS (~10x cost) rides the
  # same dispatch-only rule as the rest of this file.
  # No explicit `name:`. A matrix job whose name interpolates ${{ matrix.os }}
  # renders that expression RAW in the check list when the job is SKIPPED — the
  # matrix is never evaluated, so a contributor reads a literal
  # "drag-drop (${{ matrix.os }})". Falling back to the job id gives
  # "dragdrop (ubuntu-latest)" when it runs and a clean "dragdrop" when it does not.
  dragdrop:
    needs: configure
    if: needs.configure.outputs.run-dragdrop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.configure.outputs.dragdrop-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install tkinterdnd2 (+ Linux X11 runtime libs)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Pin ==0.4.2: from 0.4.4.1 onward the osx-arm64 tkdnd binary is the
          # Tcl-9 build (libtcl9tkdnd2.9.5.dylib) that fails to load on the
          # standard Tcl-8.6 Python ("incompatible stubs mechanism"). 0.4.2 is the
          # highest version whose osx-arm64 binary is the Tcl-8 build
          # (libtkdnd2.9.3.dylib), which loads on Tcl-8.6 across all three OSes.
          pip install "tkinterdnd2==0.4.2"
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              python3-tk xvfb libxcursor1 libxrender1 libxext6 \
              libxft2 libxinerama1 libxi6 libxrandr2
          fi

      - name: Verify drag-drop executes on ${{ matrix.os }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python scripts/crossplatform/verify_drop_target.py
          else
            python scripts/crossplatform/verify_drop_target.py
          fi
