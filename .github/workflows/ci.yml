# CI orchestrator — the ONE pipeline every change goes through.
#
# Rebuilt 2026-09-28 after the Hermes Agent pipeline (NousResearch/hermes-agent),
# adapted to this repo. What changed and why — measured on the old file:
#
#   * The test suite ran as ONE pytest process for 75-95 min on a 4-core runner
#     and hit the job timeout on most runs; one wedged test ate the budget.
#     -> scripts/ci/run_tests_parallel.py: sharded matrix, batches of files in
#        fresh processes, per-process wall clock, isolate-and-retry on failure.
#   * Its exit code was ignored (`|| echo`), so any regression rode through
#     green as long as ~1 200 tests passed.
#     -> scripts/ci/ratchet_tests.py: known failures are baselined per OS in
#        scripts/ci/test-baseline-<os>.json; a NEW failure blocks.
#   * Every PR ran every job (~20 runners, three 45-min macOS jobs on most),
#     and pushes to main cancelled each other, so main was never proven.
#     -> `detect` classifies the diff into lanes (scripts/ci/classify_changes.py,
#        fail-open); only affected lanes run. Every push to main runs the whole
#        test suite and is never cancelled; the nightly run and manual
#        dispatches run every lane.
#   * Branch protection listed five job names; renaming a job meant a settings
#     change. -> `CI gate` aggregates every job (scripts/ci/required_results.py)
#     and is the ONLY required check, for humans and for the merge train.
#   * ~25 stdlib gates were separate steps in five jobs. -> scripts/ci/run_gates.py
#     runs them in one job, all of them report, and agents run the same command
#     locally.
#
# Windows: the full sharded suite on main / nightly / dispatch; on a pull
# request only the tests the diff can reach (scripts/ci/select_tests.py).
# macOS (~10x runner cost): nightly and manual dispatch, plus the path-gated
# realtime contract and macOS desktop lanes.
#
# Action SHAs are pinned to 40-char commits (CVE-2025-30066 hardening).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *" # nightly strict full run, macOS included
  workflow_dispatch:
    inputs:
      full:
        description: "Run every lane (off = only the lanes this branch's diff against main can affect; the merge train uses off)."
        type: boolean
        default: true
      include_macos:
        description: "Also run the macOS test shards and macOS desktop lane (~10x runner cost)."
        type: boolean
        default: true
      run_contract_soak:
        description: "Run the extended synthetic realtime orchestration soak (not release evidence)."
        type: boolean
        default: false

# A pull request (or a train-dispatched branch run) collapses to its newest
# commit. A run on main is never cancelled once it runs, but pushes to main
# share one group: GitHub keeps a single PENDING run and drops older pending
# ones, so a burst of agent pushes cannot stack a backlog behind the
# organisation's concurrent-job limit — the newest run covers every commit
# before it. The nightly run and manual dispatches get their own group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && format('branch-{0}', github.ref)) || (github.event_name == 'push' && 'main-push') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # Matrix jobs carry no explicit `name:`: a skipped matrix job renders an
  # interpolated name raw ("tests macos ${{ matrix.shard }}") in the check
  # list. The job id plus the matrix value reads cleanly in both states.
  detect:
    name: detect lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.lanes.outputs.full }}
      python: ${{ steps.lanes.outputs.python }}
      frontend: ${{ steps.lanes.outputs.frontend }}
      deps: ${{ steps.lanes.outputs.deps }}
      realtime: ${{ steps.lanes.outputs.realtime }}
      cli: ${{ steps.lanes.outputs.cli }}
      dragdrop: ${{ steps.lanes.outputs.dragdrop }}
      browser: ${{ steps.lanes.outputs.browser }}
      macos_desktop: ${{ steps.lanes.outputs.macos_desktop }}
      installer: ${{ steps.lanes.outputs.installer }}
      macos: ${{ steps.mode.outputs.macos }}
      base: ${{ steps.mode.outputs.base }}
      pr_mode: ${{ steps.mode.outputs.pr_mode }}
      linux_shards: ${{ steps.shards.outputs.linux_shards }}
      windows_shards: ${{ steps.shards.outputs.windows_shards }}
      tests_full: ${{ steps.shards.outputs.tests_full }}
      os_matrix: ${{ steps.mode.outputs.os_matrix }}
    steps:
      - name: Checkout (full history for the diff base)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide run mode and diff base
        id: mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          IN_FULL: ${{ inputs.full }}
          IN_MACOS: ${{ inputs.include_macos }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # A push to main classifies its lanes like a pull request (the
          # concurrent-job limit is shared by every agent's PR), but always
          # runs the WHOLE test suite on Linux and Windows: post-merge proof
          # is never narrowed. Nightly and manual full runs force everything.
          full=false; macos=false; pr_mode=false; tests_full=false
          case "$EVENT" in
            push) tests_full=true ;;
            schedule) full=true; macos=true; tests_full=true ;;
            workflow_dispatch)
              [ "$IN_FULL" = "true" ] && full=true && tests_full=true
              [ "$IN_MACOS" = "true" ] && macos=true ;;
            pull_request) pr_mode=true ;;
          esac
          # A branch run the merge train dispatched behaves like its pull request.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$full" = "false" ]; then pr_mode=true; fi
          git fetch --no-tags --quiet origin main:refs/remotes/origin/main || true
          base="$PR_BASE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git merge-base HEAD refs/remotes/origin/main 2>/dev/null || true)"
          fi
          if [ "$EVENT" = "push" ]; then
            before="${{ github.event.before }}"
            case "$before" in (*[!0]*) git cat-file -e "$before^{commit}" 2>/dev/null && base="$before" ;; esac
          fi
          if [ "$macos" = "true" ]; then os='["ubuntu-latest","windows-latest","macos-latest"]'; else os='["ubuntu-latest","windows-latest"]'; fi
          {
            echo "full_mode=$full"; echo "tests_full=$tests_full"; echo "macos=$macos"
            echo "pr_mode=$pr_mode"; echo "base=$base"
            echo "os_matrix=$os"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Classify the change into lanes
        id: lanes
        shell: bash
        env:
          FULL: ${{ steps.mode.outputs.full_mode }}
          BASE: ${{ steps.mode.outputs.base }}
        run: |
          if [ "$FULL" = "true" ] || [ -z "$BASE" ]; then
            python3 scripts/ci/classify_changes.py --full
          else
            git diff --name-only "$BASE" HEAD | tee changed.txt | python3 scripts/ci/classify_changes.py
          fi

      # Linux always runs the whole suite in six shards. Windows runs the
      # whole suite in four shards on main, nightly, full manual runs and
      # pipeline changes; on a pull request one runner takes the tests the
      # diff can reach. A push always runs the python lane's test jobs.
      - name: Size the test matrices
        id: shards
        shell: bash
        run: |
          echo 'linux_shards=[1,2,3,4,5,6]' >> "$GITHUB_OUTPUT"
          if [ "${{ steps.mode.outputs.tests_full }}" = "true" ] || [ "${{ steps.lanes.outputs.full }}" = "true" ]; then
            echo 'windows_shards=[1,2,3,4]' >> "$GITHUB_OUTPUT"
            echo 'tests_full=true' >> "$GITHUB_OUTPUT"
          else
            echo 'windows_shards=[1]' >> "$GITHUB_OUTPUT"
            echo 'tests_full=false' >> "$GITHUB_OUTPUT"
          fi

  gates:
    name: static gates
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (full history for diff-scoped gates)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the light gate dependencies (no torch, no audio)
        run: |
          python -m pip install -e . --no-deps
          python -m pip install typer platformdirs click httpx rich pyyaml==6.0.3 pydantic loguru python-dotenv packaging
      - name: Run every static gate
        env:
          PRIVACY_PRIVATE_EMAILS: ${{ vars.PRIVACY_PRIVATE_EMAILS }}
          BASE: ${{ needs.detect.outputs.base }}
          PR_MODE: ${{ needs.detect.outputs.pr_mode }}
        run: |
          git fetch --no-tags --quiet origin main:refs/remotes/origin/main || true
          args=()
          [ -n "$BASE" ] && args+=(--base "$BASE")
          [ "$PR_MODE" = "true" ] && args+=(--pr)
          python scripts/ci/run_gates.py "${args[@]}"

  python-fast:
    name: python contracts (fast)
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install base + dev (no platform extras - the VPS/base install)
        run: python -m pip install -e ".[dev]"
      - name: Import-cleanliness gate (the bare install imports clean)
        run: python scripts/ci/check_import_clean.py
      - name: Test-only system deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2
          python -m pip install -e ".[telephony]"
      # Blocking and outside the ratchet on purpose: these pin contracts that
      # are cheap to break and expensive to notice (ADR-0011 router, AP-11
      # scrubber, AP-4 enum parity, the one turn-language resolver, skill
      # routing precision AND recall, the browser-auth standard).
      - name: Contract guards
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/unit/brain/test_routing.py \
            tests/unit/brain/test_output_filter.py \
            tests/unit/sessions/test_hangup_reason_parity.py \
            tests/unit/core/test_turn_language.py \
            tests/unit/skills/test_skill_routing_offline.py \
            tests/contract/test_plugin_auth_standard.py \
            tests/contract/test_connector_auth.py \
            tests/contract/test_service_connectors.py \
            tests/contract/test_plugin_availability.py \
            tests/contract/test_home_assistant_browser_auth.py
          python scripts/skill_relevance_calibrate.py
      - name: ruff lint (report-only backlog)
        continue-on-error: true
        run: python -m ruff check jarvis/
      - name: ruff format (report-only backlog)
        continue-on-error: true
        run: python -m ruff format --check jarvis/
      - name: mypy (report-only backlog)
        continue-on-error: true
        run: python -m mypy jarvis/

  tests-linux:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.detect.outputs.linux_shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2
          python -m pip install -e ".[dev,telephony]"
      - name: Restore the per-file duration cache (written by main only)
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: test-durations-never-exact
          restore-keys: test-durations-
      - name: Run shard
        continue-on-error: true
        run: >-
          python scripts/ci/run_tests_parallel.py tests
          --shard ${{ matrix.shard }}/6
          --report out/test-report-linux-${{ matrix.shard }}.json
          --junit-out out/junit-linux-${{ matrix.shard }}.xml
          --durations-out out/durations-linux-${{ matrix.shard }}.json
      - name: Ratchet (a failure not in the baseline blocks)
        run: python scripts/ci/ratchet_tests.py check --baseline scripts/ci/test-baseline-linux.json out/test-report-linux-${{ matrix.shard }}.json
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tests-linux-${{ matrix.shard }}
          path: out/
          retention-days: 14

  tests-windows:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.detect.outputs.windows_shards) }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Pick the tests (full run, or what this diff can reach)
        id: pick
        env:
          FULL: ${{ needs.detect.outputs.tests_full }}
          BASE: ${{ needs.detect.outputs.base }}
          SHARDS: ${{ needs.detect.outputs.windows_shards }}
        run: |
          mkdir -p out
          if [ "$FULL" = "true" ] || [ -z "$BASE" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE" HEAD > out/changed.txt
            python scripts/ci/select_tests.py --changed-from out/changed.txt --out out/selected.txt
          fi
          count=$(python -c "import json,os; print(len(json.loads(os.environ['SHARDS'])))")
          echo "total=$count" >> "$GITHUB_OUTPUT"
      - name: Install
        if: steps.pick.outputs.mode != 'none'
        run: python -m pip install -e ".[dev,telephony]"
      - name: Restore the per-file duration cache
        if: steps.pick.outputs.mode != 'none'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: test-durations-never-exact
          restore-keys: test-durations-
      - name: Run shard
        if: steps.pick.outputs.mode != 'none'
        continue-on-error: true
        run: |
          files=()
          if [ "${{ steps.pick.outputs.mode }}" = "selected" ]; then files=(--files-from out/selected.txt); fi
          python scripts/ci/run_tests_parallel.py tests "${files[@]}" \
            --shard ${{ matrix.shard }}/${{ steps.pick.outputs.total }} \
            --report out/test-report-windows-${{ matrix.shard }}.json \
            --junit-out out/junit-windows-${{ matrix.shard }}.xml
      - name: Ratchet (a failure not in the baseline blocks)
        if: steps.pick.outputs.mode != 'none'
        run: python scripts/ci/ratchet_tests.py check --baseline scripts/ci/test-baseline-windows.json out/test-report-windows-${{ matrix.shard }}.json
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tests-windows-${{ matrix.shard }}
          path: out/
          retention-days: 14

  tests-macos:
    needs: detect
    if: needs.detect.outputs.macos == 'true' && needs.detect.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,telephony]"
      - name: Restore the per-file duration cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: test-durations-never-exact
          restore-keys: test-durations-
      - name: Run shard
        continue-on-error: true
        run: >-
          python scripts/ci/run_tests_parallel.py tests --shard ${{ matrix.shard }}/3
          --report out/test-report-macos-${{ matrix.shard }}.json
          --junit-out out/junit-macos-${{ matrix.shard }}.xml
      - name: Ratchet (a failure not in the baseline blocks)
        run: python scripts/ci/ratchet_tests.py check --baseline scripts/ci/test-baseline-macos.json out/test-report-macos-${{ matrix.shard }}.json
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tests-macos-${{ matrix.shard }}
          path: out/
          retention-days: 14

  test-report:
    name: test report + floor
    needs: [detect, tests-linux]
    if: always() && needs.detect.outputs.python == 'true' && needs.tests-linux.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Download shard reports
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: tests-linux-*
          path: reports
          merge-multiple: true
      - name: Min-passed floor across all Linux shards (BLOCKING)
        run: python scripts/ci/ratchet_tests.py summary --floor --baseline scripts/ci/test-baseline-linux.json reports
      - name: Merge the duration cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/ci/ratchet_tests.py durations --out test_durations.json reports
      - name: Save the duration cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: test-durations-${{ github.run_id }}

  frontend:
    name: frontend (test + build + budget)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jarvis/ui/web/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jarvis/ui/web/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The entry chunk's size IS startup latency (AP-26's measurable half).
      - name: Startup bundle budget
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/check_frontend_bundle_budget.py

  jarvisctl:
    needs: detect
    if: needs.detect.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.detect.outputs.os_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # --no-deps proves jarvis.cli_ctl imports and renders --help with only its
      # own light runtime deps: no torch, audio or GUI stack.
      - name: Light install + import/--help smoke
        shell: bash
        run: |
          python -m pip install -e . --no-deps
          python -m pip install typer platformdirs click httpx rich pytest pytest-asyncio pyyaml pydantic loguru python-dotenv packaging
          python -c "import jarvis.cli_ctl.__main__"
          python -m jarvis.cli_ctl --help
      - name: Base install + jarvisctl unit suite
        shell: bash
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio hypothesis
          python -m pytest tests/unit/cli_ctl/ -q -p no:cacheprovider

  deps:
    name: deps-sync + portable install matrix
    needs: detect
    if: needs.detect.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install packaging==25.0 uv==0.11.19
      - name: requirements.in mirrors pyproject (AP-23)
        run: python scripts/ci/check_requirements_sync.py
      - name: Lockfile universal + GPU-free
        run: python scripts/ci/check_lockfile_universal.py
      - name: Target-resolved portable install matrix
        run: python scripts/ci/check_portable_install_matrix.py --jobs 4

  realtime-contract:
    needs: detect
    if: needs.detect.outputs.realtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Portable base + focused runner
        shell: bash
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio
      - name: Provider-neutral realtime contract
        run: python -m pytest tests/contract/test_gpt_live.py tests/contract/test_realtime_provider_contract.py tests/contract/test_realtime_reliability_gate.py -q -p no:cacheprovider

  realtime-slim:
    name: realtime on python:3.11-slim (no PortAudio)
    needs: detect
    if: needs.detect.outputs.realtime == 'true'
    runs-on: ubuntu-latest
    container: python:3.11-slim
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Base install without system audio
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio
      - name: The container really has no usable PortAudio
        run: |
          python - <<'PY'
          try:
              import sounddevice  # noqa: F401
          except Exception as exc:
              print(f"NO_PORTAUDIO: {type(exc).__name__}: {exc}")
          else:
              raise SystemExit("python:3.11-slim unexpectedly loaded PortAudio")
          PY
      - name: Headless realtime degradation contract
        run: python -m pytest tests/contract/test_gpt_live.py tests/contract/test_realtime_provider_contract.py tests/contract/test_realtime_reliability_gate.py -q -p no:cacheprovider

  soak:
    name: realtime contract soak (not release evidence)
    needs: detect
    if: github.event_name == 'workflow_dispatch' && inputs.run_contract_soak
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python scripts/realtime_reliability_gate.py --contract-soak

  dragdrop:
    needs: detect
    if: needs.detect.outputs.dragdrop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.detect.outputs.os_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # ==0.4.2: later osx-arm64 builds are Tcl-9 and fail on Tcl-8.6 Python.
      - name: Install tkinterdnd2 (+ Linux X11 runtime)
        shell: bash
        run: |
          pip install "tkinterdnd2==0.4.2"
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-tk xvfb libxcursor1 libxrender1 libxext6 libxft2 libxinerama1 libxi6 libxrandr2
          fi
      - name: Drag-drop executes
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python scripts/crossplatform/verify_drop_target.py
          else
            python scripts/crossplatform/verify_drop_target.py
          fi

  browser:
    name: browser runtime
    needs: detect
    if: needs.detect.outputs.browser == 'true'
    uses: ./.github/workflows/browser-runtime.yml

  macos-desktop:
    name: macOS desktop
    needs: detect
    if: needs.detect.outputs.macos_desktop == 'true' && (needs.detect.outputs.full != 'true' || needs.detect.outputs.macos == 'true')
    uses: ./.github/workflows/macos-desktop.yml

  installer:
    name: installer smoke
    needs: detect
    if: needs.detect.outputs.installer == 'true'
    uses: ./.github/workflows/installer-smoke.yml
    with:
      force: ${{ needs.detect.outputs.full == 'true' }}
      include_macos: ${{ needs.detect.outputs.macos == 'true' }}

  # The ONE required check. Branch protection and the merge train read only
  # this; a new job needs nothing but a line in `needs`.
  gate:
    name: CI gate
    needs:
      - detect
      - gates
      - python-fast
      - tests-linux
      - tests-windows
      - tests-macos
      - test-report
      - frontend
      - jarvisctl
      - deps
      - realtime-contract
      - realtime-slim
      - soak
      - dragdrop
      - browser
      - macos-desktop
      - installer
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Evaluate every job
        env:
          NEEDS: ${{ toJSON(needs) }}
          STRICT: ${{ github.event_name == 'schedule' }}
        run: |
          args=()
          [ "$STRICT" = "true" ] && args+=(--strict)
          printf '%s' "$NEEDS" | python3 scripts/ci/required_results.py "${args[@]}"
