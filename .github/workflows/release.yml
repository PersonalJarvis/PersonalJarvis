# Publish Personal Jarvis to PyPI on every `v*` tag.
#
# No API token and no repository secret is involved: PyPI's Trusted Publishing
# mints a short-lived, single-use credential from this workflow's OIDC identity.
# That identity is (owner, repository, workflow FILE NAME, environment), so the
# five values below must match the publisher registered on PyPI exactly —
# renaming this file or the environment silently breaks every future release:
#
#   PyPI project   personal-jarvis
#   Owner          PersonalJarvis
#   Repository     PersonalJarvis
#   Workflow       release.yml
#   Environment    pypi
#
# The build and the publish are two jobs on purpose. Only the tiny publish job
# holds `id-token: write` and enters the `pypi` environment, so the OIDC token
# is never reachable from the step that executes project code.
#
# Action SHAs are pinned to 40-char commits (CVE-2025-30066 hardening), matching
# the rest of this repo's workflows.

name: Release to PyPI

on:
  push:
    tags:
      - "v*"
  # A published version can never be replaced, so a re-run is for the case where
  # the upload itself failed (network, a mis-registered publisher) while the tag
  # is already correct.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      # A tag that disagrees with the shipped version would publish something
      # nobody can trace back to a commit. Fail before the artifacts exist.
      - name: Verify the tag matches the packaged version
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          package_version="$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("jarvis/__init__.py").read_text()).group(1))')"
          echo "tag=${tag_version} pyproject=${project_version} package=${package_version}"
          if [ "${tag_version}" != "${project_version}" ] || [ "${project_version}" != "${package_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject (${project_version}) / jarvis.__version__ (${package_version})."
            exit 1
          fi

      # The README becomes the whole project page, rendered on PyPI's domain
      # where repo-relative paths do not resolve. Catch them before publishing,
      # not after someone reports broken images.
      - name: Verify the README has no repo-relative URLs
        run: python scripts/ci/check_readme_absolute_urls.py README.md

      - name: Build
        run: python -m build

      # Metadata only. Do NOT read this as "the README was checked": twine maps
      # `text/markdown` to no renderer at all ("Rendering cannot fail"), so a
      # Markdown long_description is never rendered here and always passes. The
      # README's real failure mode is covered by the URL gate above instead.
      - name: Check the packaging metadata
        run: python -m twine check --strict dist/*

      - name: Upload the artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The ONLY thing this job is trusted with: minting the OIDC token that
      # PyPI exchanges for a short-lived upload credential.
      id-token: write
    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
