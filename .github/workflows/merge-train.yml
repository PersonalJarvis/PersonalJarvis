# Merge train — integrates several coding agents' pull requests without a human.
#
# main requires a merge queue. The train no longer lands anything itself; it
# keeps agent pull requests mergeable and hands the green ones to the queue,
# which tests each one on top of the newest main (ci.yml's `merge_group` run)
# before GitHub squash-merges it. Every tick (a push to main, a finished CI
# run - pull request or merge queue -, hourly, or by hand):
#
#   1. Eligible PRs: same repository, base main, not a draft, head branch
#      codex/ claude/ agent/ gemini/ cursor/ bot/ — or labelled `auto-merge`.
#      `no-auto-merge`, `do-not-merge`, `wip` or `needs-human` opt a PR out.
#      Forks and Dependabot never qualify (supply-chain bumps stay human).
#   2. A PR that CONFLICTS with main (or whose CI, or merge-queue run, failed
#      while it was behind) gets main merged into it
#      (scripts/ci/agent_integrate.py): generated files are regenerated,
#      append-only files union-merged, everything else goes to the optional
#      AI resolver or is reported with a `needs-rebase` label. No force push.
#      A PR that is merely behind is left alone: the queue re-tests it on
#      the newest main anyway.
#   3. Every green, conflict-free PR joins the merge queue (pinned to the
#      head commit its CI tested). A head the queue already failed is held
#      until a new push or a train update. Without a queue on main (the
#      rollback path) the train squash-merges one green PR per tick instead.
#
# Trust: three jobs, three privilege levels.
#   plan       read-only token, no secrets, runs no pull-request code.
#   integrate  read-only token. PR code (regenerators: npm ci, the frontend
#              build, Python generators) runs here and only here. The AI
#              resolver's API keys live in ONE step, which runs before any
#              PR code on that machine; the CLIs are pinned to exact versions.
#   apply      the write token, runs no PR code: pushes the integrate job's
#              git bundles (checked to build on the planned head and main),
#              labels, comments, approves parked CI runs, enqueues.
# Only people with push access can put a branch on the train (forks are
# excluded), so a pushed update is no more trusted than their own push: CI
# and the merge queue test it before anything lands.
#
# Tokens: with the optional INTEGRATION_TOKEN secret (a fine-grained PAT or App
# token with contents + pull-requests write), pushes fire the normal
# pull_request events. Without it the train uses GITHUB_TOKEN: the
# pull_request run its own push triggers parks in "action_required" and the
# train approves it on the next tick (a dispatched run would never count for
# the pull request).
#
# AI conflict resolution is optional: set ANTHROPIC_API_KEY (Claude Code) or
# OPENAI_API_KEY (Codex CLI). Without a key, semantic conflicts are reported.

name: Merge train

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    # A safety net only: queue merges (push), PR and merge-queue CI results
    # (workflow_run) drive the train. Hourly catches a missed event.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what the train would do without pushing, enqueueing or merging."
        type: boolean
        default: false

# One train at a time; a queued tick replaces an older queued one.
concurrency:
  group: merge-train
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      updates: ${{ steps.plan.outputs.updates }}
    steps:
      # The repository is public: later fetches need no credentials, so none
      # are persisted. Only main's checkout is used; no PR code runs here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Decide one action per pull request
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/agent_integrate.py plan --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/train"
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: merge-train-plan
          path: ${{ runner.temp }}/train/plan.json
          if-no-files-found: error
          retention-days: 3

  integrate:
    name: integrate (merge main, resolve, regenerate)
    needs: plan
    if: needs.plan.outputs.updates != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Regenerator dependencies (mirrors, reference docs, locks)
        # main's own checkout; each PR worktree is put first on PYTHONPATH
        # when its generators run.
        run: |
          python -m pip install -e . --no-deps
          python -m pip install typer platformdirs click httpx rich pyyaml pydantic loguru python-dotenv packaging uv==0.11.19
      - name: Restore recorded conflict resolutions (git rerere)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .git/rr-cache
          key: rerere-${{ github.run_id }}
          restore-keys: rerere-
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: merge-train-plan
          path: ${{ runner.temp }}/train
      - name: Merge main into each branch (no secrets, no PR code)
        id: merge
        run: |
          git config --global user.name "jarvis-merge-train[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/ci/agent_integrate.py merge --dir "$RUNNER_TEMP/train"
      - name: Optional AI conflict resolver (API keys; before any PR code runs)
        if: steps.merge.outputs.pending != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Exact versions: an unpinned global install would run whatever was
          # published a minute ago with these keys in its environment. (Claude
          # Code's own postinstall picks its pinned platform binary.)
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            npm install -g @anthropic-ai/claude-code@2.1.292 >/dev/null
            cmd='claude -p --permission-mode acceptEdits --allowedTools Read,Edit'
          elif [ -n "$OPENAI_API_KEY" ]; then
            npm install -g --ignore-scripts @openai/codex@0.160.1 >/dev/null
            cmd='codex exec --full-auto -'
          else
            echo "No resolver key configured - semantic conflicts are reported, not resolved."
            exit 0
          fi
          python scripts/ci/agent_integrate.py resolve --dir "$RUNNER_TEMP/train" --resolver-cmd "$cmd"
      - name: Regenerate and bundle (runs PR code; no secrets, read-only token)
        run: python scripts/ci/agent_integrate.py finish --dir "$RUNNER_TEMP/train"
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: merge-train-updates
          path: |
            ${{ runner.temp }}/train/state/
            ${{ runner.temp }}/train/bundles/
          if-no-files-found: warn
          retention-days: 3

  apply:
    name: apply (push updates, enqueue, approve)
    needs: [plan, integrate]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.INTEGRATION_TOKEN || github.token }}
      TOKEN_IS_BOT: ${{ secrets.INTEGRATION_TOKEN == '' }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      # The write token is never persisted into .git; `gh auth setup-git`
      # hands it to git only for this step's pushes. Nothing from a pull
      # request executes in this job: bundles are fetched as data.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: merge-train-plan
          path: ${{ runner.temp }}/train
      - name: Download prepared updates
        if: needs.integrate.result == 'success'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: merge-train-updates
          path: ${{ runner.temp }}/train
      - name: Run the train
        run: |
          gh auth setup-git
          args=(--dir "$RUNNER_TEMP/train")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$TOKEN_IS_BOT" = "true" ] && args+=(--token-is-bot)
          python scripts/ci/agent_integrate.py apply "${args[@]}"
