# Native macOS desktop verification on both supported processor families.
# TCC dialogs require a signed, foreground GUI app and therefore cannot be
# approved in CI. This workflow verifies the full dependency install, stable
# bundle construction, permission fail-closed behavior (an ask outside the
# installed app is refused, never made), and Computer-Use math;
# the release checklist retains one physical-Mac grant/click sign-off.

name: macOS desktop

# Called by ci.yml's `macos_desktop` lane (path-gated there; on full runs only
# when macOS is included) and runnable by hand. The caller owns concurrency.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            runner: macos-15-intel
            architecture: x86_64
            python: "3.12"
          - name: Apple Silicon
            runner: macos-15
            architecture: arm64
            python: "3.13"
          # BUG-060 regression row: the stub launcher must also link against
          # a NON-framework interpreter (uv's python-build-standalone), the
          # layout py2app never supported.
          - name: Intel standalone (uv)
            runner: macos-15-intel
            architecture: x86_64
            python: "3.12"
            python-source: uv-standalone
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # The venv created below shadows the setup-python interpreter on PATH,
      # so every later `python` invocation in this job runs the uv-managed
      # standalone (non-framework) build.
      - name: Provision a standalone (non-framework) Python via uv
        if: matrix.python-source == 'uv-standalone'
        shell: bash
        run: |
          python -m pip install uv
          uv python install ${{ matrix.python }}
          uv venv --seed --python ${{ matrix.python }} "$HOME/standalone-venv"
          echo "$HOME/standalone-venv/bin" >> "$GITHUB_PATH"

      - name: Assert the interpreter is a non-framework build
        if: matrix.python-source == 'uv-standalone'
        shell: bash
        run: |
          python -c "import sysconfig,sys; sys.exit(0 if (sysconfig.get_config_var('PYTHONFRAMEWORK') or '')=='' else 1)"

      - name: Verify native architecture
        shell: bash
        run: |
          python -c "import platform; actual=platform.machine(); expected='${{ matrix.architecture }}'; print(actual); assert actual == expected, (actual, expected)"

      - name: Install the advertised full profile
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python scripts/pip_install.py -e ".[full,dev]"

      - name: Import native permission frameworks
        run: python -c "import AVFoundation, ApplicationServices, AppKit, Foundation, HIServices, Quartz, ScreenCaptureKit"

      # A bare Python on a runner is not the installed app, so the permission
      # service must not start a native request of its own there (design P6):
      # the ask is refused with the reason "outside the installed app" and
      # nothing is requested. The runner's own TCC grants (a pre-granted
      # responsible process) are read as they are, never refused. Every state the
      # runner can report (granted, not determined, denied, restricted, no
      # desktop session) must pass: the step asserts only that nothing was
      # requested and that nothing but a granted state reads as granted.
      #
      # The three native request seams of the real port are replaced by tripwires
      # BEFORE the call, so "nothing was requested" is proven at the port and not
      # only through the service's own bookkeeping, and a regression can never
      # reach a real dialog on the runner.
      - name: Verify headless permission asks fail closed
        shell: bash
        run: |
          python - <<'PY'
          from jarvis.platform.permission_service import PermissionOutcome, get_permission_service
          from jarvis.platform.permissions import (
              PermissionId,
              PermissionState,
              get_system_permission_port,
          )

          port = get_system_permission_port()
          assert port.platform == "darwin", port.platform
          assert port.outside_installed_app is True

          attempts = []

          def forbidden(*_args, **_kwargs):
              attempts.append(1)
              raise AssertionError("a native permission request was made outside the installed app")

          port.request_native = forbidden
          port._iohid_request = forbidden
          port._automation_consent_runner = forbidden

          result = get_permission_service().ensure(PermissionId.MICROPHONE, feature="voice")
          print(result.outcome, result.state, result.asked, result.outside_installed_app)
          assert attempts == [], "the port was asked to make a native request"
          assert result.asked is False, "a native request was made outside the installed app"
          if result.state is not PermissionState.GRANTED:
              assert result.outcome is not PermissionOutcome.GRANTED
          PY

      # Symbol binding: every framework function the permission port and the
      # service bind by name must resolve on the runner's macOS. A rename or a
      # missing symbol fails here instead of silently reading as "unavailable"
      # on a user's Mac. Only the symbols the port reads without a fallback are
      # required; the optional ones are reported.
      - name: Probe the native permission symbols
        shell: bash
        run: |
          python - <<'PY'
          import importlib

          REQUIRED = {
              "AVFoundation": ["AVCaptureDevice", "AVMediaTypeAudio"],
              "ApplicationServices": [
                  "AXIsProcessTrusted",
                  "AXIsProcessTrustedWithOptions",
                  "kAXTrustedCheckOptionPrompt",
              ],
              "AppKit": ["NSWorkspace", "NSRunningApplication"],
              "Foundation": ["NSBundle", "NSURL"],
              "Quartz": [
                  "CGPreflightScreenCaptureAccess",
                  "CGRequestScreenCaptureAccess",
                  "CGPreflightListenEventAccess",
                  "CGRequestListenEventAccess",
                  "CGEventTapCreate",
              ],
          }
          OPTIONAL = {
              "AVFoundation": [
                  "AVAuthorizationStatusNotDetermined",
                  "AVAuthorizationStatusRestricted",
                  "AVAuthorizationStatusDenied",
                  "AVAuthorizationStatusAuthorized",
              ],
              "Quartz": ["CGPreflightPostEventAccess", "CGRequestPostEventAccess"],
          }

          missing = []
          for module_name, names in REQUIRED.items():
              module = importlib.import_module(module_name)
              missing += [f"{module_name}.{name}" for name in names if not hasattr(module, name)]
          for module_name, names in OPTIONAL.items():
              module = importlib.import_module(module_name)
              for name in names:
                  if not hasattr(module, name):
                      print(f"optional symbol absent: {module_name}.{name}")
          assert not missing, f"native permission symbols did not bind: {missing}"
          PY

      # Smoke of the service against the real frameworks, never interactive: every
      # state read must come back as a PermissionState (types only; the runner's
      # grants are whatever they are), a background ensure must never ask, and the
      # non-asking Apple Event probe must return on its own (it runs on a daemon
      # thread with a deadline: a hang is the failure this step exists to catch).
      - name: Smoke the permission service without asking
        shell: bash
        timeout-minutes: 5
        run: |
          python - <<'PY'
          import threading

          from jarvis.platform.permission_service import PermissionOutcome, get_permission_service
          from jarvis.platform.permissions import (
              PermissionId,
              PermissionState,
              get_system_permission_port,
          )

          port = get_system_permission_port()
          service = get_permission_service()

          attempts = []

          def forbidden(*_args, **_kwargs):
              attempts.append(1)
              raise AssertionError("a native permission request was made without a gesture")

          port.request_native = forbidden
          port._iohid_request = forbidden
          port._automation_consent_runner = forbidden

          for permission in PermissionId:
              state = service.check(permission)
              assert isinstance(state, PermissionState), (permission, state)
              result = service.ensure(permission, feature="voice", interactive=False)
              print(permission.value, state.value, result.outcome)
              assert result.asked is False, permission
              if result.outcome is PermissionOutcome.GRANTED:
                  assert result.granted and result.state in (
                      PermissionState.GRANTED,
                      PermissionState.NOT_REQUIRED,
                  ), permission
          assert attempts == [], "a native request was made without a gesture"

          answer = []
          probe = threading.Thread(
              target=lambda: answer.append(port._automation_probe("com.apple.Music", False)),
              daemon=True,
          )
          probe.start()
          probe.join(30)
          assert not probe.is_alive(), "the non-asking Automation probe did not return"
          assert answer[0] is None or isinstance(answer[0], int), answer
          PY

      - name: Build and self-probe the native app identity
        shell: bash
        run: |
          python - <<'PY'
          import plistlib
          import tempfile
          from pathlib import Path

          from jarvis.setup.macos_app_bundle import (
              BUNDLE_ID,
              ensure_macos_app_bundle,
              macos_app_bundle_is_launchable,
          )

          with tempfile.TemporaryDirectory() as raw:
              bundle = ensure_macos_app_bundle(
                  install_dir=Path.cwd(),
                  applications_dir=Path(raw),
              )
              assert bundle is not None
              assert macos_app_bundle_is_launchable(bundle)
              with (bundle / "Contents" / "Info.plist").open("rb") as stream:
                  assert plistlib.load(stream)["CFBundleIdentifier"] == BUNDLE_ID
          PY

      - name: macOS permission, bundle, and Computer-Use tests
        shell: bash
        run: |
          python -m pytest -q \
            tests/integration/test_admin_unix_loopback.py \
            tests/unit/admin/test_unix_socket_transport.py \
            tests/unit/platform/test_permissions.py \
            tests/unit/platform/test_permission_service*.py \
            tests/unit/platform/test_permission_characterization.py \
            tests/unit/platform/test_permissions_state_api.py \
            tests/unit/platform/test_permission_agent_boundary.py \
            tests/unit/platform/test_fake_tcc.py \
            tests/unit/platform/test_no_legacy_permission_api.py \
            tests/unit/core/test_permission_events.py \
            tests/contract/test_permission_service_contract.py \
            tests/unit/audio/test_capture_permission_gate.py \
            tests/unit/ui/web/test_permissions_routes.py \
            tests/unit/ui/web/test_permissions_snapshot.py \
            tests/unit/ui/web/test_keybinds_input_monitoring_ask.py \
            tests/unit/ui/test_desktop_macos_permission_gate.py \
            tests/unit/ui/test_window_command.py \
            tests/unit/ui/test_desktop_detached_windows.py \
            tests/unit/ui/test_desktop_background.py \
            tests/unit/ui/test_window_fullscreen.py \
            tests/unit/setup/test_macos_app_bundle.py \
            tests/unit/setup/test_desktop_integration.py \
            tests/unit/autostart/test_macos.py \
            tests/unit/autostart/test_command.py \
            tests/unit/ci/test_boot_harness_portability.py \
            tests/unit/cu/test_geometry.py \
            tests/unit/cu/test_actuate.py \
            tests/unit/cu/test_capture.py \
            tests/unit/cu/test_engine_loop.py \
            tests/unit/cu/test_target_guard.py \
            tests/unit/harness/test_action_registry.py \
            tests/unit/platform/test_window_state.py \
            tests/unit/platform/test_window_state_rects.py \
            tests/unit/plugins/tool/test_click_foreground_guard.py \
            tests/unit/plugins/tool/test_hotkey_tool.py \
            tests/unit/plugins/tool/test_scroll.py \
            tests/unit/plugins/tool/test_type_text.py \
            tests/unit/vision/test_ax_tree.py \
            tests/unit/vision/test_element_at_point.py \
            tests/unit/vision/test_select_capture_monitor.py \
            tests/unit/trigger/test_hotkey_backends.py \
            tests/unit/trigger/test_quartz_jit_permissions.py \
            tests/unit/platform/test_screen_access.py \
            tests/unit/audio/test_ducking_permissions.py \
            tests/unit/dictation/test_insert_permission.py \
            tests/unit/cu/test_system_dialogs.py \
            tests/unit/speech/test_voice_permission_jit.py \
            tests/unit/packaging/test_macos_privacy_strings.py \
            tests/unit/packaging/test_macos_build_script.py \
            tests/unit/ci/test_check_frozen_macos_app.py \
            tests/unit/ci/test_macos_desktop_permission_step.py
