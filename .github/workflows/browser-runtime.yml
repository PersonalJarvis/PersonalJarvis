name: Browser runtime
on:
  workflow_dispatch:
    inputs:
      test_ref:
        description: "Immutable source SHA for the ARM64 installer race diagnostic"
        type: string
        required: true
permissions:
  contents: read
jobs:
  reproduce:
    name: ARM64 concurrent installer reproduction
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.test_ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the same base and test environment
        run: python scripts/pip_install.py -e ".[dev]"
      - name: Annotate only the rejected path diagnostic
        shell: python
        run: |
          from pathlib import Path
          p = Path("jarvis/society/browser/install.py")
          text = p.read_text(encoding="utf-8")
          needle = 'raise RuntimeError("Browser verification used an unmanaged executable")'
          replacement = 'raise RuntimeError(f"Browser verification used an unmanaged executable: root={root!s}; resolved_root={root.resolve()!s}; executable={executable!s}")'
          assert needle in text
          p.write_text(text.replace(needle, replacement), encoding="utf-8")
      - name: Repeat the fake installer in fresh processes
        shell: python
        run: |
          import json, os, subprocess, sys
          from pathlib import Path
          out = Path("race-evidence")
          out.mkdir()
          results = []
          for i in range(40):
              result = subprocess.run(
                  [sys.executable, "-m", "pytest", "tests/unit/society/test_browser_install.py::test_simultaneous_installers_promote_only_one_runtime",
                   "-q", "--tb=short", "--basetemp", str(out / f"tmp-{i}"),
                   "--junitxml", str(out / f"result-{i}.xml")],
                  capture_output=True, text=True, encoding="utf-8", errors="replace",
                  timeout=90, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0),
                  env={**os.environ, "PYTHONUTF8": "1"},
              )
              (out / f"run-{i}.log").write_text(result.stdout + result.stderr, encoding="utf-8")
              results.append({"attempt": i, "exit_code": result.returncode})
              print(i, result.returncode, flush=True)
              if result.returncode:
                  print((result.stdout + result.stderr)[-5000:], flush=True)
          (out / "summary.json").write_text(json.dumps(results, indent=2))
      - name: Preserve race evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64-installer-race
          path: |
            race-evidence/*.log
            race-evidence/*.json
            race-evidence/*.xml
          if-no-files-found: error
