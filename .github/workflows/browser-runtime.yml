name: Browser runtime
# Called by ci.yml's `browser` lane (path-gated there) and runnable by hand.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the base app and test dependencies
        run: python scripts/pip_install.py -e ".[dev]"
      - name: Provision Linux browser system libraries
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install-deps chromium
      - name: Install and verify the isolated browser runtime
        run: python -m jarvis.society.browser.install
      - name: Select verified browser artifacts
        shell: python
        run: |
          import os
          from jarvis.society.browser.install import venv_python, browser_executable
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"JARVIS_BROWSER_TEST_PYTHON={venv_python()}\n")
              stream.write(f"JARVIS_BROWSER_TEST_EXECUTABLE={browser_executable()}\n")
      - name: Test real frames, ownership and protocol
        run: python -m pytest tests/contract/test_browser_live.py tests/contract/test_browser_contract.py tests/contract/test_browser_desktop_mcp.py tests/contract/test_browser_cli_model.py tests/unit/society/test_browser.py tests/unit/society/test_browser_install.py tests/unit/society/test_approvals.py tests/unit/agent_chat/test_jarvis_identity.py tests/unit/agent_chat/test_agent_chat_ladders.py tests/unit/brain/test_tool_gateway.py -q --tb=short --junitxml=browser-results.xml
      - name: Preserve browser test evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: browser-results-${{ matrix.os }}
          path: browser-results.xml
