name: Browser runtime
# Called by ci.yml's `browser` lane (path-gated there) and runnable by hand.
on:
  workflow_dispatch:
    inputs:
      test_ref:
        description: "Immutable source SHA for the original ARM64 browser test context"
        type: string
        required: true
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.test_ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the base app and test dependencies
        run: python scripts/pip_install.py -e ".[dev]"
      - name: Provision Linux browser system libraries
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install-deps chromium
      - name: Install and verify the isolated browser runtime
        run: python -m jarvis.society.browser.install
      - name: Select verified browser artifacts
        shell: python
        run: |
          import os
          from jarvis.society.browser.install import venv_python, browser_executable
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"JARVIS_BROWSER_TEST_PYTHON={venv_python()}\n")
              stream.write(f"JARVIS_BROWSER_TEST_EXECUTABLE={browser_executable()}\n")
      - name: Record rejected installer paths
        shell: python
        run: |
          from pathlib import Path
          p = Path("jarvis/society/browser/install.py")
          text = p.read_text(encoding="utf-8")
          needle = 'raise RuntimeError("Browser verification used an unmanaged executable")'
          replacement = 'raise RuntimeError(f"Browser verification used an unmanaged executable: root={root!s}; resolved_root={root.resolve()!s}; executable={executable!s}")'
          assert needle in text
          p.write_text(text.replace(needle, replacement), encoding="utf-8")
      - name: Repeat the original browser suite with native provisioning
        shell: python
        run: |
          import json, os, subprocess, sys
          from pathlib import Path
          out = Path("race-evidence")
          out.mkdir()
          files = ['tests/contract/test_browser_live.py', 'tests/contract/test_browser_contract.py', 'tests/contract/test_browser_desktop_mcp.py', 'tests/contract/test_browser_cli_model.py', 'tests/unit/society/test_browser.py', 'tests/unit/society/test_browser_install.py', 'tests/unit/society/test_approvals.py', 'tests/unit/agent_chat/test_jarvis_identity.py', 'tests/unit/agent_chat/test_agent_chat_ladders.py', 'tests/unit/brain/test_tool_gateway.py']
          results = []
          for i in range(5):
              result = subprocess.run(
                  [sys.executable, "-m", "pytest", *files, "-q", "--tb=short",
                   "--junitxml", str(out / f"result-{i}.xml")],
                  capture_output=True, text=True, encoding="utf-8", errors="replace",
                  timeout=600, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0),
                  env={**os.environ, "PYTHONUTF8": "1"},
              )
              (out / f"run-{i}.log").write_text(result.stdout + result.stderr, encoding="utf-8")
              results.append({"attempt": i, "exit_code": result.returncode})
              print(i, result.returncode, flush=True)
              if result.returncode:
                  print((result.stdout + result.stderr)[-6000:], flush=True)
          (out / "summary.json").write_text(json.dumps(results, indent=2))
      - name: Preserve full-context race evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64-browser-context-race
          path: race-evidence/
          if-no-files-found: error
