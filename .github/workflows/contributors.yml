# Keep the README's contributor avatar wall current.
#
# A "Thanks to everyone who has shipped something here" list that never updates
# is worse than none: the first person to land a pull request looks for their
# face, does not find it, and reads that as the project not caring. This job
# regenerates the block between the contributors markers once a week and
# commits it only when it actually changed.
#
# It does NOT run as a required check on pull requests. Making a stale wall
# fail CI would turn every new contributor's own arrival into a red X.
#
# Action SHAs are pinned to the same 40-char commits ci.yml already vetted
# (CVE-2025-30066 hardening).

name: Contributors

on:
  schedule:
    # Mondays, 04:17 UTC. Off the hour so it does not queue behind the crowd.
    - cron: "17 4 * * 1"
  # The moment that actually matters: somebody's first pull request just landed
  # and they go looking for their face. Waiting up to a week for the Monday run
  # is exactly the disappointment this section exists to avoid.
  #
  # `pull_request_target` rather than `pull_request` on purpose. A pull request
  # from a fork - which is what every outside contribution is - gets a
  # read-only token under `pull_request`, so the job could regenerate the wall
  # but never push it. `pull_request_target` runs in the base repository's
  # context with a writable token. That is only safe because this job never
  # checks out or executes anything from the pull request: it checks out `main`
  # explicitly below and the script only reads the GitHub API.
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  # Dispatch ci.yml for the wall commit and wait for its result (see below).
  actions: write

concurrency:
  # One constant group, NOT keyed on the ref: every run of this job pushes to
  # main, so a merge-triggered run and the Monday run overlapping would have
  # them racing on the same branch. Serialise instead, and never cancel - a
  # cancelled run silently drops somebody off the wall until the next one.
  group: contributors
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh the avatar wall
    # A closed-but-not-merged pull request adds nobody.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # The commit waits for a CI run before it may land on main.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The job pushes, so it needs a real branch rather than a detached HEAD.
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Regenerate the block
        env:
          # Lifts the contributors API rate limit; no extra scope needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci/update_contributors.py

      - name: Land the change through CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "contributors: nothing changed, no commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # main is protected: a push lands only when the commit already carries
          # a green `CI gate` check. A plain `git push origin main` was rejected
          # with GH006 on every run, so the wall never changed. GITHUB_TOKEN
          # pushes and pull requests start no workflow, but a workflow_dispatch
          # does: the commit goes to a side branch, CI runs on exactly that
          # commit, and the same commit is then fast-forwarded onto main. Branch
          # protection stays untouched.
          branch="bot/contributor-wall"
          drop_side_branch() {
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              git push --quiet origin --delete "$branch"
            fi
          }
          landed=""
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python scripts/ci/update_contributors.py
            if git diff --quiet -- README.md; then
              echo "contributors: main is already current."
              landed="yes"
              break
            fi
            git add -- README.md
            git commit --quiet -m "docs(readme): refresh the contributor avatar wall"
            sha="$(git rev-parse HEAD)"

            # The side branch is ours alone; a leftover from an earlier run is
            # removed so the push below never needs --force.
            drop_side_branch
            git push --quiet origin "HEAD:refs/heads/$branch"
            gh workflow run ci.yml --ref "$branch" -f full=false -f include_macos=false

            run_id=""
            for _ in $(seq 1 30); do
              run_id="$(gh run list --workflow ci.yml --branch "$branch" --event workflow_dispatch                 --commit "$sha" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              [ -n "$run_id" ] && break
              sleep 10
            done
            if [ -z "$run_id" ]; then
              echo "::error::contributors: the CI run for $sha never appeared."
              drop_side_branch
              exit 1
            fi
            echo "contributors: waiting for CI run $run_id on $sha."
            if ! gh run watch "$run_id" --interval 30 --exit-status >/dev/null; then
              echo "::error::contributors: CI run $run_id failed; the wall does not land."
              drop_side_branch
              exit 1
            fi

            # A fast-forward only: when main moved during the CI run, the next
            # attempt regenerates on the new main instead of landing a stale wall.
            if git push --quiet origin "$sha:refs/heads/main"; then
              landed="yes"
              break
            fi
            echo "contributors: main moved during CI (attempt $attempt), retrying."
          done

          drop_side_branch
          if [ -z "$landed" ]; then
            echo "::error::contributors: main kept moving; the next merge or the Monday run retries."
            exit 1
          fi
