# Dependabot configuration for PersonalJarvis/PersonalJarvis.
#
# Wave-5 audit Finding 4 (repo hygiene): the main repo had no dependabot
# configuration, so vulnerable transitive deps in pip and unmaintained
# GitHub Actions could land silently. This file enables weekly updates
# for both ecosystems with PRs grouped per ecosystem to keep noise down.
#
# All Dependabot PRs land as PRs (never auto-merge) — the supply-chain
# pinning discipline (40-char SHA pins for actions, SHA-256 pins for
# downloaded binaries) requires a human to validate the new SHA + hash
# before merging. See install/TRUST_ROOT.md §6+§7 for the bumping
# procedure.

version: 2

# Public PyPI, declared as the base index for the root `uv` entry below.
# Dependabot builds its list of Python index URLs from the job credentials. With
# no registry, the always-present GitHub `git_source` credential becomes an
# EMPTY index URL next to the default one. When a security update has to fetch
# hashes again (requirements.txt carries two pinned versions of av, numpy,
# onnxruntime and scipy, one per platform split, so it always does), hashin
# requests "/pypi/av/json" with no host and the job dies with
# `ValueError: unknown url type`. Every uv security update failed that way
# (multidict, urllib3, PyJWT in 2026-09/10). A base-replacing registry makes
# this the only index URL, and urljoin() turns it into
# https://pypi.org/pypi/<name>/json. It needs no credentials.
registries:
  pypi:
    type: python-index
    url: https://pypi.org/simple
    replaces-base: true

updates:
  # Build tooling is a separate small lock surface; do not recompile the
  # platform-universal application lock when refreshing packaging tools.
  - package-ecosystem: pip
    directory: /scripts/ci
    # New releases wait a week before a PR, so a hijacked publish is
    # usually caught and yanked before it can reach this repository.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      build-toolchain:
        patterns: ["*"]
  # GitHub Actions — the supply-chain critical path. Every action in
  # .github/workflows/*.yml is pinned by 40-char commit SHA (per the
  # AP from CVE-2025-30066). Dependabot will propose SHA bumps weekly;
  # review the diff carefully before merging (read TRUST_ROOT.md §7).
  - package-ecosystem: github-actions
    directory: /
    # New releases wait a week before a PR, so a hijacked publish is
    # usually caught and yanked before it can reach this repository.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
      - supply-chain
    commit-message:
      prefix: deps
      include: scope

  # Python (pip) — VERSION UPDATES ARE OFF ON PURPOSE (2026-08-22).
  #
  # `requirements.txt` in this repo is a PLATFORM-UNIVERSAL lockfile, produced by
  #   uv pip compile --universal --generate-hashes --python-version 3.11   #       --output-file=requirements.txt requirements.in
  # `--universal` emits the per-OS environment markers that let ONE lockfile
  # install correctly on Windows, macOS and Linux. Dependabot recompiles without
  # it, so every pip PR it opened here arrived with those markers stripped —
  # `colorama ; sys_platform == 'win32'` lost its condition, the Apple-Silicon
  # `onnxruntime` and `av` entries vanished, `audioop-lts` lost its
  # `python_version >= '3.13'` guard. Each of those PRs failed the blocking
  # deps-sync gate by construction and none was ever mergeable (#62-#65, #101).
  #
  # Worse than unmergeable: the grouped PR also proposed bumps that the
  # portable-install matrix proves would brick advertised platforms — vosk
  # 0.3.45 (no macOS wheel exists) and ddgs 9.14.4 (pulls brotli, which has no
  # Windows-ARM64 wheel). Dependabot cannot see those constraints; the matrix
  # gate can.
  #
  # `open-pull-requests-limit: 0` disables VERSION updates only. Dependabot
  # SECURITY updates are configured separately in the repository settings and
  # still fire, so advisories keep reaching the repo — they are then serviced by
  # hand through the compile command above, which is also what the header of
  # `requirements.in` instructs.
  - package-ecosystem: pip
    directory: /
    # New releases wait a week before a PR, so a hijacked publish is
    # usually caught and yanked before it can reach this repository.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - python
    commit-message:
      prefix: deps
      include: scope

  # uv — the ecosystem Dependabot actually runs for the root since uv.lock
  # exists: every root security update since 2026-09 is a "uv in /." job, which
  # rewrites uv.lock and requirements.txt together. Version updates stay off for
  # the reasons above (limit 0); this entry exists so security updates get the
  # `pypi` registry (see the top of this file) and the project's labels.
  - package-ecosystem: uv
    directory: /
    registries:
      - pypi
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - python
    commit-message:
      prefix: deps
      include: scope

  # Container base images are pinned by digest (multi-arch index) so a
  # rebuilt image cannot silently change; this keeps those digests current.
  - package-ecosystem: docker
    directories: ["/", "/keyproxy", "/board-backend"]
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    groups:
      base-images:
        patterns: ["*"]
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: deps
      include: scope
