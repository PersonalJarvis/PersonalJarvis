<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 392" width="1200" height="392" role="img" aria-labelledby="title desc">
<title id="title">How a request flows through Personal Jarvis</title>
<desc id="desc">1. You ask by voice or chat. 2. Jarvis decides how to handle it. 3. It answers directly, acts with your desktop, browser, plugins or MCP tools, or delegates to an agent such as Codex or Claude Code. 4. Every action passes a risk check (safe, monitor, ask you, block), and you approve risky steps. 5. The result comes back with a recorded run history.</desc>
