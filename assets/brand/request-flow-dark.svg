<text x="362.0" y="52" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.6"><tspan fill="#eac56b">2</tspan><tspan fill="#8b949e" dx="8">DECIDE</tspan></text>
<text x="624.0" y="52" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.6"><tspan fill="#eac56b">3</tspan><tspan fill="#8b949e" dx="8">DO</tspan></text>
<text x="854.0" y="52" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.6"><tspan fill="#eac56b">4</tspan><tspan fill="#8b949e" dx="8">CHECK</tspan></text>
<text x="1061.0" y="52" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.6"><tspan fill="#eac56b">5</tspan><tspan fill="#8b949e" dx="8">DELIVER</tspan></text>
