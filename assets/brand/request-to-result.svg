<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 244" role="img" aria-labelledby="title desc">
  <title id="title">From request to result</title>
  <desc id="desc">You give Jarvis a task by voice or chat. Jarvis plans, acts, and checks across your connected workspace: computer, browser, apps, agents, models, and services. The result comes back with its run history.</desc>
  <defs>
    <radialGradient id="bg-glow" cx="27%" cy="50%" r="60%">
      <stop offset="0" stop-color="#1c1810"/>
      <stop offset="1" stop-color="#0d1117"/>
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2632"/>
      <stop offset="1" stop-color="#151c26"/>
    </linearGradient>
    <linearGradient id="jarvis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a311d"/>
      <stop offset="1" stop-color="#262014"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202a37"/>
      <stop offset="1" stop-color="#1a222d"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#eac56b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .flow { fill: none; stroke: #eac56b; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 7; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -18; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
      .icon { fill: none; stroke: #a9b7c8; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="244" rx="18" fill="url(#bg-glow)"/>
  <rect width="1200" height="244" rx="18" fill="url(#dots)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- You -->
    <rect x="24" y="66" width="150" height="112" rx="14" fill="url(#node)" stroke="#5d6b7d" stroke-width="1.5"/>
    <g class="icon" transform="translate(87 82)">
      <circle cx="12" cy="7" r="4.5"/>
      <path d="M3 22c1.2-5 4.6-7.5 9-7.5s7.8 2.5 9 7.5"/>
    </g>
    <text x="99" y="134" fill="#f7f7f4" font-size="22" font-weight="700">You</text>
    <text x="99" y="158" fill="#9aa8b8" font-size="14">voice or chat</text>

    <path class="flow" d="M182 122H224" marker-end="url(#head)"/>

    <!-- Jarvis -->
    <rect x="240" y="74" width="182" height="96" rx="20" fill="#eac56b" fill-opacity="0.22" filter="url(#glow)"/>
    <rect x="234" y="62" width="194" height="120" rx="14" fill="url(#jarvis)" stroke="#eac56b" stroke-width="2"/>
    <path transform="translate(319 78)" d="M12 0c.9 5.6 5.4 10.1 11 11-5.6.9-10.1 5.4-11 11-.9-5.6-5.4-10.1-11-11 5.6-.9 10.1-5.4 11-11z" fill="#eac56b"/>
    <text x="331" y="134" fill="#fff0bf" font-size="24" font-weight="700">Jarvis</text>
    <text x="331" y="158" fill="#e3cf98" font-size="14">plans, acts, checks</text>

    <path class="flow" d="M436 122H470" marker-end="url(#head)"/>

    <!-- Workspace -->
    <rect x="482" y="16" width="488" height="212" rx="16" fill="#111821" fill-opacity="0.85" stroke="#4a5768" stroke-width="1.5"/>
    <text x="726" y="45" fill="#f7f7f4" font-size="17" font-weight="700">Your connected workspace</text>

    <g fill="url(#tile)" stroke="#3f4b5b" stroke-width="1.2">
      <rect x="498" y="62" width="144" height="70" rx="10"/>
      <rect x="654" y="62" width="144" height="70" rx="10"/>
      <rect x="810" y="62" width="144" height="70" rx="10"/>
      <rect x="498" y="142" width="144" height="70" rx="10"/>
      <rect x="654" y="142" width="144" height="70" rx="10"/>
      <rect x="810" y="142" width="144" height="70" rx="10"/>
    </g>

    <!-- tile icons, 22 px boxes centred above each label -->
    <g class="icon">
      <g transform="translate(559 72)">
        <rect x="1" y="2" width="20" height="13" rx="2"/>
        <path d="M8 20h6M11 15v5"/>
      </g>
      <g transform="translate(715 72)">
        <circle cx="11" cy="11" r="9"/>
        <ellipse cx="11" cy="11" rx="4" ry="9"/>
        <path d="M2 11h18"/>
      </g>
      <g transform="translate(871 72)">
        <rect x="2" y="2" width="7.5" height="7.5" rx="2"/>
        <rect x="12.5" y="2" width="7.5" height="7.5" rx="2"/>
        <rect x="2" y="12.5" width="7.5" height="7.5" rx="2"/>
        <rect x="12.5" y="12.5" width="7.5" height="7.5" rx="2"/>
      </g>
      <g transform="translate(559 152)">
        <rect x="2" y="7" width="18" height="13" rx="3.5"/>
        <path d="M11 2.5v4.5"/>
        <circle cx="11" cy="2.5" r="0.6"/>
        <path d="M8 13v1.5M14 13v1.5"/>
      </g>
      <g transform="translate(715 152)">
        <rect x="5" y="5" width="12" height="12" rx="2"/>
        <rect x="8.5" y="8.5" width="5" height="5" rx="1"/>
        <path d="M9 1.5v3.5M13 1.5v3.5M9 17v3.5M13 17v3.5M1.5 9H5M1.5 13H5M17 9h3.5M17 13h3.5"/>
      </g>
      <g transform="translate(871 152)">
        <path d="M7 2v5M15 2v5"/>
        <path d="M4 7h14v4a7 7 0 0 1-14 0z"/>
        <path d="M11 18v3"/>
      </g>
    </g>

    <g fill="#eef1f4" font-size="15" font-weight="600">
      <text x="570" y="119">Computer</text>
      <text x="726" y="119">Browser</text>
      <text x="882" y="119">Apps</text>
      <text x="570" y="199">Agents</text>
      <text x="726" y="199">Models</text>
      <text x="882" y="199">Services</text>
    </g>

    <path class="flow" d="M978 122H1012" marker-end="url(#head)"/>

    <!-- Result -->
    <rect x="1026" y="66" width="150" height="112" rx="14" fill="url(#node)" stroke="#5d6b7d" stroke-width="1.5"/>
    <g transform="translate(1089 82)">
      <circle cx="12" cy="12" r="10.5" fill="none" stroke="#7fcf9a" stroke-width="1.8"/>
      <path d="M7.5 12.3l3.1 3.1 6-6.4" fill="none" stroke="#7fcf9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1101" y="134" fill="#f7f7f4" font-size="22" font-weight="700">Result</text>
    <text x="1101" y="158" fill="#9aa8b8" font-size="14">+ run history</text>
  </g>
</svg>
