<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">How Jarvis handles a request</title>
<desc id="desc">You ask by voice or chat, for example to sort the Downloads folder and delete duplicates. Jarvis picks one of three routes: answer directly, act on your desktop, browser, apps and tools, or delegate longer work to an agent. Every action passes a risk check of safe, monitor, ask you, or block; deleting files asks you first. The result comes back with every step saved in the run history.</desc>
<defs><marker id="ha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#0969da" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="hm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#c4ccd4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="419" rx="18" fill="#ffffff" stroke="#d1d9e0"/>
<circle cx="53" cy="52" r="13" fill="none" stroke="#0969da" stroke-width="1.6"/><text x="53" y="57" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">1</text><text x="76" y="58" font-size="18" font-weight="600" fill="#1f2328">You ask</text>
<circle cx="443" cy="52" r="13" fill="none" stroke="#0969da" stroke-width="1.6"/><text x="443" y="57" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">2</text><text x="466" y="58" font-size="18" font-weight="600" fill="#1f2328">Jarvis picks a route</text>
<circle cx="883" cy="52" r="13" fill="none" stroke="#0969da" stroke-width="1.6"/><text x="883" y="57" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">3</text><text x="906" y="58" font-size="18" font-weight="600" fill="#1f2328">Checked, then done</text>
<path d="M56 163h258a16 16 0 0 1 16 16v118a16 16 0 0 1-16 16H84l-28 22v-22a16 16 0 0 1-16-16V179a16 16 0 0 1 16-16z" fill="#f6f8fa" stroke="#d1d9e0"/>
<g transform="translate(62 182) scale(0.8333333333333334)" fill="none" stroke="#59636e" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></g>
<text x="90" y="198" font-size="15" fill="#59636e">Voice or chat</text>
<text font-size="21" font-weight="500" fill="#1f2328"><tspan x="62" y="240">“Sort my Downloads</tspan><tspan x="62" y="268">folder and delete</tspan><tspan x="62" y="296">the duplicates.”</tspan></text>
<path d="M330 238H366C398 238 398 138 426 138" fill="none" stroke="#c4ccd4" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round" marker-end="url(#hm)"/>
<path d="M366 238C398 238 398 338 426 338" fill="none" stroke="#c4ccd4" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round" marker-end="url(#hm)"/>
<path d="M330 238H426" fill="none" stroke="#0969da" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ha)"/>
<rect x="430" y="96" width="360" height="84" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><g transform="translate(452 126) scale(1.0)" fill="none" stroke="#59636e" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></g><text x="496" y="133" font-size="20" font-weight="600" fill="#1f2328">Answer</text><text x="496" y="158" font-size="16" fill="#59636e">Replies right away</text>
<rect x="430" y="196" width="360" height="84" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/><g transform="translate(452 226) scale(1.0)" fill="none" stroke="#0969da" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></g><text x="496" y="233" font-size="20" font-weight="600" fill="#1f2328">Act</text><text x="496" y="258" font-size="16" fill="#59636e">Desktop, browser, apps, tools</text><rect x="704" y="214" width="68" height="24" rx="12" fill="#0969da"/><text x="738" y="231" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">picked</text>
<rect x="430" y="296" width="360" height="84" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><g transform="translate(452 326) scale(1.0)" fill="none" stroke="#59636e" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></g><text x="496" y="333" font-size="20" font-weight="600" fill="#1f2328">Delegate</text><text x="496" y="358" font-size="16" fill="#59636e">Hands long work to an agent</text>
<path d="M790 238H818C846 238 846 181 866 181" fill="none" stroke="#0969da" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ha)"/>
<rect x="870" y="96" width="290" height="170" rx="14" fill="#f6f8fa" stroke="#d1d9e0"/>
<g transform="translate(892 112) scale(0.9166666666666666)" fill="none" stroke="#59636e" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></g>
<text x="924" y="129" font-size="18" font-weight="600" fill="#1f2328">Risk check</text>
<rect x="892" y="148" width="121" height="32" rx="16" fill="#ffffff" stroke="#d1d9e0"/><text x="952.5" y="169" text-anchor="middle" font-size="15" font-weight="500" fill="#59636e">safe</text>
<rect x="1019" y="148" width="121" height="32" rx="16" fill="#ffffff" stroke="#d1d9e0"/><text x="1079.5" y="169" text-anchor="middle" font-size="15" font-weight="500" fill="#59636e">monitor</text>
<rect x="892" y="188" width="121" height="32" rx="16" fill="#0969da" stroke="#0969da"/><text x="952.5" y="209" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">ask you</text>
<rect x="1019" y="188" width="121" height="32" rx="16" fill="#ffffff" stroke="#d1d9e0"/><text x="1079.5" y="209" text-anchor="middle" font-size="15" font-weight="500" fill="#59636e">block</text>
<text x="892" y="246" font-size="16" fill="#59636e">Deleting files asks you first.</text>
<path d="M1015 266V292" fill="none" stroke="#0969da" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ha)"/>
<rect x="870" y="296" width="290" height="84" rx="14" fill="#f6f8fa" stroke="#d1d9e0"/>
<g transform="translate(892 326) scale(1.0)" fill="none" stroke="#0969da" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/></g>
<text x="936" y="333" font-size="20" font-weight="600" fill="#1f2328">Done</text>
<text x="936" y="358" font-size="16" fill="#59636e">Every step saved in history</text>
</svg>
