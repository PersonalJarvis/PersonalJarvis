# Golden routing set for the deterministic skill matcher.
#
# Every `text` here is a SIMULATED USER UTTERANCE — matching data, the content
# under test, not project prose. That is why this file is German-heavy.
#
# Rules this file must obey (enforced by tests/unit/skills/test_skill_routing_offline.py):
#
#  1. A positive must NOT match the skill's own voice-trigger regex. If it
#     does, it proves nothing about the relevance layer — it would have fired
#     in 2025 already. The anti-echo test rejects such entries.
#  2. `min_band` records the WEAKEST acceptable outcome, and it is a MEASURED
#     baseline, not an aspiration. Raising one is a real improvement; lowering
#     one is a regression that must be visible in a diff.
#  3. Cross-skill negatives are GENERATED, not written: every skill's positives
#     are automatically hard negatives for every other skill.
#  4. `global_negatives` must reach band `none` for EVERY skill. These are the
#     turns the assistant owns itself — smalltalk, knowledge questions, coding
#     help, and the local-action commands the deterministic desktop gate owns.
#
# Provenance markers: `authored` = written for this file, `eval` = lifted from
# scripts/skill_routing_eval.py, `forensic` = a real utterance quoted in a bug
# comment. A skill whose positives are 100 % `authored` gets a warning: real
# paraphrases come from real transcripts.

