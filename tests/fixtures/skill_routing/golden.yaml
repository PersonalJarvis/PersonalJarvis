# ---------------------------------------------------------------------------
# Utterances that must fire NOTHING, whatever is installed.
# ---------------------------------------------------------------------------
global_negatives:
  # -- smalltalk / conversation -------------------------------------------
  - text: "wie ist das wetter heute in berlin"
    channel: relevance
    reason: smalltalk
  - text: "erzaehl mir einen witz"
    channel: relevance
    reason: smalltalk
  - text: "guten abend, wie war dein tag"
    channel: relevance
    reason: smalltalk
  - text: "danke dir, das war sehr hilfreich"
    channel: relevance
    reason: acknowledgement
  # -- knowledge questions -------------------------------------------------
  - text: "kannst du mir kurz erklaeren wie photosynthese funktioniert"
    channel: relevance
    reason: knowledge question
  - text: "was haeltst du von rust als programmiersprache"
    channel: relevance
    reason: opinion question
  - text: "wer hat den zweiten weltkrieg beendet"
    channel: relevance
    reason: knowledge question
  - text: "was ist die hauptstadt von australien"
    channel: relevance
    reason: knowledge question
  # -- deliberation the assistant must answer, never act on ----------------
  - text: "kann ich dagegen rechtlich eigentlich was machen?"
    channel: relevance
    reason: forensic — user deliberating, not tasking (turn_planner)
  - text: "soll ich es einfach kaufen oder noch warten"
    channel: relevance
    reason: decision help, not an action request
  - text: "ich hab da mal eine frage, was wuerdest du mir empfehlen?"
    channel: relevance
    reason: forensic — conversational opener (manager.py force-spawn bug)
  # -- coding help ---------------------------------------------------------
  - text: "schreib mir eine funktion die eine liste sortiert"
    channel: relevance
    reason: coding request, no skill involved
  - text: "warum wirft mein python skript einen keyerror"
    channel: relevance
    reason: debugging question
  # -- local actions the deterministic desktop gate owns -------------------
  - text: "mach mal lauter"
    channel: relevance
    reason: local action, owned by the local-action gate
  - text: "mach einen screenshot"
    channel: relevance
    reason: local action
  - text: "schliess das fenster"
    channel: relevance
    reason: local action
  # -- mission vocabulary (AD-S9 owns these) -------------------------------
  - text: "spawne einen sub-agent der das recherchiert"
    channel: relevance
    reason: explicit heavy-work request, the mission path owns it
